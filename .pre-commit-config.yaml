# House hooks run via `prek` (`uv run prek install` once per clone).
# Local hooks gate every commit touching Python on clean `ruff` lint +
# format and a clean `ty` check. Order follows ruff's own guidance: lint
# first, formatter last so it tidies anything the lint pass touched. `ty`
# is a whole-project check, so it takes no filenames.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]
